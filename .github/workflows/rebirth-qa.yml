name: Rebirth QA

on:
  push:
    branches:
      - feat/rebirth-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rebirth-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, unit, build and browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        id: install
        run: npm ci
      - name: Rebirth runtime isolation gate
        id: boundary
        run: node scripts/check-rebirth-boundary.mjs
      - name: TypeScript typecheck
        id: typecheck
        run: npm run typecheck
      - name: Vitest unit tests
        id: unit
        run: npm test
      - name: V2 candidate installer regression tests
        id: candidate_installer
        run: python3 -m unittest discover -s tests/python -p 'test_*.py' -v
      - name: Production build
        id: build
        run: npm run build
      - name: Install Chromium and WebKit
        id: browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Rebirth gate browser smoke (desktop engines; NOT real phones)
        id: smoke
        run: npx playwright test tests/e2e/smoke.spec.ts --project=chromium --project=webkit
      - name: Mobile landscape input lab browser checks (emulated, not physical phones)
        id: input_lab
        run: npx playwright test tests/e2e/rebirth-input-lab.spec.ts --project=chromium --project=webkit
      - name: Write QA run summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          BOUNDARY_OUTCOME: ${{ steps.boundary.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          UNIT_OUTCOME: ${{ steps.unit.outcome }}
          CANDIDATE_INSTALLER_OUTCOME: ${{ steps.candidate_installer.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          BROWSERS_OUTCOME: ${{ steps.browsers.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          INPUT_LAB_OUTCOME: ${{ steps.input_lab.outcome }}
        run: |
          {
            echo "## Rebirth QA"
            echo ""
            echo "- Commit: \`$COMMIT_SHA\`"
            echo "- Overall job status: $JOB_STATUS"
            echo "- Full per-step evidence: $RUN_URL"
            echo "- npm ci: $INSTALL_OUTCOME"
            echo "- Rebirth isolation guard: $BOUNDARY_OUTCOME"
            echo "- TypeScript typecheck: $TYPECHECK_OUTCOME"
            echo "- Vitest unit tests: $UNIT_OUTCOME"
            echo "- V2 candidate installer regression tests: $CANDIDATE_INSTALLER_OUTCOME"
            echo "- Production build: $BUILD_OUTCOME"
            echo "- Browser install: $BROWSERS_OUTCOME"
            echo "- Playwright gate Chromium/WebKit: $SMOKE_OUTCOME"
            echo "- Playwright mobile input lab Chromium/WebKit: $INPUT_LAB_OUTCOME"
            echo "- Browser engines: desktop Chromium and WebKit (not physical mobile devices)"
            echo "- Physical iOS/Android tests: NOT RUN by this workflow"
          } | tee rebirth-qa-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rebirth-qa-evidence
          path: |
            rebirth-qa-summary.md
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7
