name: Rebirth QA

on:
  push:
    branches:
      - feat/rebirth-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rebirth-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, unit, build and browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Vitest unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Browser smoke (desktop engines; NOT real phones)
        run: npx playwright test --project=chromium --project=webkit
      - name: Write QA run summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## Rebirth QA"
            echo ""
            echo "- Commit: \`$COMMIT_SHA\`"
            echo "- Overall job status: $JOB_STATUS"
            echo "- Full per-step evidence: $RUN_URL"
            echo "- Browser engines: desktop Chromium and WebKit (not physical mobile devices)"
            echo "- Physical iOS/Android tests: NOT RUN by this workflow"
          } | tee rebirth-qa-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rebirth-qa-evidence
          path: |
            rebirth-qa-summary.md
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7
